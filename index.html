<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KATGA K3 (3–12 Huruf)</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/script.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>KATGA K3</h1>
      <p class="sub">
        Tebak kata terkait K3. Panjang kata dinamis <b>3–12 huruf</b>.
        Tekan <b>Enter</b> untuk submit, <b>⌫</b> untuk hapus.
      </p>
    </header>

    <section class="game">
      <div id="board" class="board" aria-label="Papan permainan"></div>

      <div id="keyboard" class="keyboard" aria-label="Keyboard virtual"></div>

      <div class="controls">
        <div class="row">
          <input id="guess" class="input" type="text" maxlength="12" autocomplete="off" placeholder="Ketik..." />
          <button id="submit" class="btn primary">Coba</button>
          <button id="reset" class="btn">Reset</button>
          <button id="share" class="btn" disabled>Copy Hasil</button>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>

      <textarea id="shareText" class="shareText" readonly
        placeholder="Hasil emoji akan muncul di sini setelah ada tebakan..."></textarea>
    </section>

    <footer class="footer">
      <small>Jawaban: istilah K3. Tebakan: kamus umum per panjang kata (3–12).</small>
    </footer>
  </main>

  <!-- Modal Makna Kata (muncul saat menang) -->
  <div id="meaningModal" class="modal" aria-hidden="true">
    <div class="modalContent" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Jawaban Benar ✅</h2>
      <p class="modalWord">Kata: <b id="modalWord">-</b></p>
      <p id="modalMeaning" class="modalMeaning">-</p>
      <button id="closeModal" class="btn primary">Tutup</button>
    </div>
  </div>
</body>
</html>
